name: Daily threat-intel update

on:
  schedule:
    # 06:00 UTC every day. GitHub Actions cron can be delayed during peak load.
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # allow manual trigger from the Actions tab

permissions:
  contents: write  # required to manage releases

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run aggregator
        run: python3 aggregate.py

      - name: Show run summary
        run: cat output/last_run.json

      - name: Refresh README KPI section
        run: python3 scripts/render_kpis.py

      - name: Commit README if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README.md unchanged, skipping commit."
          else
            git add README.md
            git commit -m "chore: refresh README KPIs from $(date -u +%Y-%m-%d) run"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          SHA=$(git rev-parse --short HEAD)
          TOTAL=$(jq -r '.total_unique_iocs' output/last_run.json)
          KEPT=$(jq -r '.consolidated_kept' output/last_run.json)
          FP=$(jq -r '.false_positives_excluded' output/last_run.json)

          # Drop the previous 'latest' release + tag (ignore error on first run)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            --title "Daily blocklist — ${DATE}" \
            --notes "Auto-generated on ${DATE} UTC from commit ${SHA}.

          - Unique IOCs aggregated: **${TOTAL}**
          - Entries in consolidated.hosts: **${KEPT}**
          - False positives excluded (Tranco top 10k + whitelist): **${FP}**

          Stable download URLs:
          - https://github.com/${{ github.repository }}/releases/latest/download/consolidated.hosts
          - https://github.com/${{ github.repository }}/releases/latest/download/stats.csv
          - https://github.com/${{ github.repository }}/releases/latest/download/false_positives.csv" \
            output/consolidated.hosts \
            output/stats.csv \
            output/false_positives.csv
